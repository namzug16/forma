[package]
name = "forma"
version = "0.1.0"
edition = "2024"
description = "Agent-first, headless 2D design engine"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
thiserror = "2.0.21"
tiny-skia = "0.12.0"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# Decoding and rasterizing are unusably slow unoptimized.
[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
tempfile = "3.27.0"
