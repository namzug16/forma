[package]
name = "forma"
version = "0.1.0"
edition = "2024"
description = "Agent-first, headless 2D design engine"
license = "MIT"

[workspace]
members = ["desktop"]

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
clap = { version = "4.6.7", features = ["derive"] }
fontdb = "0.24.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
resvg = { version = "0.49.0", default-features = false, features = ["raster-images"] }
rustybuzz = "0.20.1"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
thiserror = "2.0.21"
tiny-skia = "0.12.0"
ureq = "3.5.0"
usvg = { version = "0.49.0", default-features = false }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# Decoding and rasterizing are unusably slow unoptimized.
[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
tempfile = "3.27.0"
